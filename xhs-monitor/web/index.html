<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>小红书销量监控</title>
<!-- 空图标：不给的话浏览器每次都去请求 /favicon.ico，界面测试会记下一堆 404 -->
<link rel="icon" href="data:,">
<style>
  * { box-sizing: border-box; min-width: 0; }
  :root {
    --bg:#f6f6f3; --card:#fff; --line:rgba(0,0,0,.10); --line2:rgba(0,0,0,.18);
    --tx:#1a1a1a; --tx2:#62625e; --tx3:#96968f;
    --accent:#D85A30; --up:#D85A30; --teal:#0F6E56; --teal-l:#9FE1CB;
    --red:#A32D2D; --red-l:#FCEBEB; --warnbg:#FAEEDA; --warntx:#854F0B;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg:#17171a; --card:#202024; --line:rgba(255,255,255,.12); --line2:rgba(255,255,255,.22);
      --tx:#ececec; --tx2:#a5a5a0; --tx3:#76766f;
      --accent:#F0997B; --up:#F0997B; --teal:#5DCAA5; --teal-l:#1D9E75;
      --red:#F09595; --red-l:#3a2020; --warnbg:#3a2f18; --warntx:#FAC775;
    }
  }
  body {
    margin:0; padding:16px 14px 70px; background:var(--bg); color:var(--tx);
    font:13px/1.6 -apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;
    -webkit-font-smoothing:antialiased;
    padding-bottom:calc(70px + env(safe-area-inset-bottom));
  }
  .wrap { max-width:1120px; margin:0 auto; }

  header { display:flex; align-items:flex-start; justify-content:space-between; gap:12px; flex-wrap:wrap; margin-bottom:14px; }
  h1 { font-size:18px; font-weight:500; margin:0 0 3px; }
  .sub { color:var(--tx2); font-size:12px; }
  .schedline { font-size:11px; color:var(--tx3); margin-top:2px; }
  .schedline b { color:var(--tx2); font-weight:500; }
  .schedset { color:var(--tx3); cursor:pointer; border-bottom:.5px dotted var(--line2); margin-left:2px; }
  .schedset:hover { color:var(--tx); }
  .actions { display:flex; gap:8px; flex-wrap:wrap; }

  button {
    font:inherit; font-size:13px; padding:8px 14px; border-radius:8px;
    border:.5px solid var(--line2); background:var(--card); color:var(--tx); cursor:pointer; transition:opacity .15s;
  }
  button:hover:not(:disabled){opacity:.72} button:disabled{opacity:.4;cursor:not-allowed}
  button.primary{background:var(--accent);border-color:var(--accent);color:#fff;font-weight:500}
  button.ghost{background:transparent}
  button.sm{padding:4px 10px;font-size:12px}
  button.danger{color:var(--red)}
  button.icon{padding:8px 11px;font-size:15px;line-height:1}

  .card{background:var(--card);border:.5px solid var(--line);border-radius:12px;padding:16px 18px;margin-bottom:14px}
  .ch{font-size:13px;font-weight:500;margin-bottom:12px;display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}

  .banner{padding:12px 16px;border-radius:10px;margin-bottom:14px;font-size:13px;display:flex;gap:12px;align-items:center;justify-content:space-between;flex-wrap:wrap}
  .banner.warn{background:var(--warnbg);color:var(--warntx)}
  .banner.ok{background:var(--teal-l);color:var(--teal)}
  .banner.err{background:var(--red-l);color:var(--red)}
  @media (prefers-color-scheme:dark){.banner.ok{background:rgba(29,158,117,.18);color:var(--teal)}}

  .kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px;margin-bottom:14px}
  .kpi{background:var(--card);border:.5px solid var(--line);border-radius:10px;padding:13px 15px}
  .kl{font-size:11px;color:var(--tx2);margin-bottom:5px}
  .kv{font-size:22px;font-weight:500;font-variant-numeric:tabular-nums;overflow-wrap:break-word}
  .kv.pos{color:var(--up)} .kv.sm{font-size:13px;font-weight:400}

  /* 分组标签栏 */
  .groupbar{display:flex;gap:7px;flex-wrap:wrap;align-items:center;margin-bottom:14px}
  .gtab{
    display:inline-flex;align-items:center;gap:6px;padding:7px 13px;border-radius:8px;
    border:.5px solid var(--line2);background:var(--card);color:var(--tx2);
    font-size:12px;cursor:pointer;transition:all .15s;white-space:nowrap;
  }
  .gtab:hover{opacity:.75}
  .gtab.on{background:var(--tx);color:var(--bg);border-color:var(--tx)}
  .gtab .cnt{font-size:10px;opacity:.65;font-variant-numeric:tabular-nums}
  .gtab .gtool{font-size:11px;opacity:.5;margin-left:2px;padding:0 2px}
  .gtab .gtool:hover{opacity:1}
  .gtab.add{border-style:dashed;color:var(--tx3)}
  .gname{overflow:hidden;text-overflow:ellipsis;max-width:170px}

  /* 商品管理弹窗 */
  .mtabs{display:flex;gap:4px;border-bottom:.5px solid var(--line);margin-bottom:14px}
  .mtab{padding:8px 14px;font-size:13px;color:var(--tx2);cursor:pointer;border-bottom:2px solid transparent;
        display:flex;align-items:center;gap:6px;margin-bottom:-.5px}
  .mtab.on{color:var(--tx);border-bottom-color:var(--tx);font-weight:500}
  .mtab .cnt{font-size:10px;opacity:.6;font-variant-numeric:tabular-nums}
  .mhint{font-size:11px;color:var(--tx3);line-height:1.7;background:var(--bg);border:.5px solid var(--line);
         border-radius:8px;padding:9px 11px;margin-bottom:12px}
  .mlist{max-height:46vh;overflow-y:auto}
  .mrow2{display:flex;align-items:center;gap:10px;padding:9px 0;border-bottom:.5px solid var(--line)}
  .mrow2:last-child{border-bottom:none}
  .mrow2main{flex:1 1 auto;min-width:0}
  .mrow2name{font-size:13px;color:var(--tx);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .rowsub{font-size:11px;color:var(--tx3);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;margin-top:1px}
  .mrow2act{flex:0 0 auto;display:flex;gap:6px}
  .gtagx{color:var(--tx2)}

  /* 分组概览表 */
  .ovtable .grow{cursor:pointer;transition:background .12s}
  .ovtable .grow:hover{background:var(--bg)}
  .ovtable .grow:hover .growgo{color:var(--tx);border-bottom-color:var(--line2)}
  .growname{font-size:13px;color:var(--tx);font-weight:500}
  .growgo{font-size:11px;color:var(--tx3);border-bottom:.5px dotted transparent;padding-bottom:1px}

  /* 店铺 → 商品 两层 */
  .shoprow{cursor:pointer}
  .shoprow:hover{background:var(--bg)}
  .shoprow td{border-bottom:.5px solid var(--line);padding-top:11px;padding-bottom:9px}
  .shopline{display:flex;align-items:center;gap:7px;flex-wrap:wrap}
  .caret{font-size:11px;color:var(--tx3);width:11px;flex:0 0 11px;display:inline-block;text-align:center}
  .caret.ph{visibility:hidden}
  .shopname{font-size:13px;font-weight:500;color:var(--tx)}
  .shopcnt{font-size:10px;color:var(--tx3);background:var(--bg);border:.5px solid var(--line);
           border-radius:4px;padding:0 5px;line-height:1.6}
  .shopnum{font-weight:500}
  .shoprow.collapsed td{border-bottom-color:var(--line2)}
  .prodrow td{padding-top:6px;padding-bottom:6px;border-bottom:none;background:transparent}
  .prodrow:last-child td{border-bottom:.5px solid var(--line)}
  .prodrow td:first-child{padding-left:26px}
  .prodline{font-size:12px;color:var(--tx2);line-height:1.45}
  .prodrow .num{font-size:12px;color:var(--tx2)}
  .prodrow .up{color:var(--up)}

  /* 二次确认框 */
  .cfmbox{background:var(--bg);border:.5px solid var(--line);border-radius:10px;padding:12px 14px;margin-bottom:12px}
  .cfmrow{display:flex;gap:10px;font-size:12px;padding:4px 0;line-height:1.5}
  .cfmrow:not(:last-child){border-bottom:.5px dashed var(--line)}
  .cfmk{flex:0 0 68px;color:var(--tx3);font-size:11px}
  .cfmv{flex:1 1 auto;color:var(--tx);overflow-wrap:break-word}
  .cfmimpact{font-size:11px;line-height:1.7;color:var(--tx2);margin-top:8px;padding-top:8px;border-top:.5px solid var(--line)}
  .cfmimpact.danger{color:var(--red)}
  button.dangerBtn{background:var(--red);border-color:var(--red);color:#fff;font-weight:500}
  @media (prefers-color-scheme:dark){button.dangerBtn{color:#1a1a1a}}

  /* 组内对比 */
  .cmp{display:flex;flex-direction:column;gap:2px}
  .cmprow{display:flex;align-items:center;gap:10px;padding:7px 0;border-bottom:.5px solid var(--line)}
  .cmprow:last-child{border-bottom:none}
  .cmpname{flex:0 0 130px;font-size:12px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .cmpshop{font-size:10px;color:var(--tx3);display:block;overflow:hidden;text-overflow:ellipsis}
  .cmpbar{flex:1 1 auto;min-width:0}
  .cmpval{flex:0 0 96px;text-align:right;font-size:12px;font-variant-numeric:tabular-nums;white-space:nowrap}
  .cmpdelta{flex:0 0 58px;text-align:right;font-size:12px;font-variant-numeric:tabular-nums;white-space:nowrap}

  .grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(0,1fr));gap:14px}

  input,select,textarea{
    font:inherit;font-size:13px;width:100%;padding:8px 11px;
    border:.5px solid var(--line2);border-radius:8px;background:var(--bg);color:var(--tx)
  }
  textarea{resize:vertical;min-height:62px;line-height:1.6;font-family:inherit}
  input:focus,select:focus,textarea:focus{outline:none;border-color:var(--accent)}
  label{display:block;font-size:11px;color:var(--tx2);margin-bottom:4px}
  .formrow{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:11px;margin-bottom:12px}

  table{width:100%;border-collapse:collapse;font-size:12px}
  th{text-align:left;font-weight:500;color:var(--tx2);padding:7px 8px;border-bottom:.5px solid var(--line);white-space:nowrap}
  td{padding:10px 8px;border-bottom:.5px solid var(--line);vertical-align:middle}
  tr:last-child td{border-bottom:none}
  .num{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
  .up{color:var(--up);font-weight:500}
  .dim{color:var(--tx3)}
  .nm{overflow-wrap:break-word}
  .sh{font-size:11px;color:var(--tx3)}
  a{color:var(--tx2);text-decoration:none;border-bottom:.5px solid var(--line2)}
  .tag{display:inline-block;padding:1px 6px;font-size:10px;border-radius:4px;background:var(--red-l);color:var(--red)}
  /* 今日增量旁的小记号：有日切下修被排除在外时显示，避免"看着在涨其实在跌" */
  .cutmark{margin-left:3px;font-size:10px;color:var(--red);opacity:.85;cursor:help;white-space:nowrap}
  .tag.p{background:var(--warnbg);color:var(--warntx)}
  .tag.gtag{background:var(--bg);color:var(--tx2);border:.5px solid var(--line2);margin-left:6px;max-width:130px;overflow:hidden;text-overflow:ellipsis;vertical-align:middle}

  .empty{text-align:center;padding:38px 14px;color:var(--tx2)}
  .empty b{display:block;color:var(--tx);font-weight:500;margin-bottom:6px;font-size:14px}

  svg{width:100%;height:auto;display:block}

  .prog{height:5px;background:var(--line);border-radius:3px;overflow:hidden;margin:9px 0 7px}
  .prog i{display:block;height:100%;background:var(--accent);transition:width .3s}
  .log{font-size:12px;color:var(--tx2);max-height:190px;overflow-y:auto}
  .log div{padding:3px 0;border-bottom:.5px solid var(--line)}
  .log div:last-child{border:none}
  .log .ok{color:var(--teal)} .log .no{color:var(--red)}

  .foot{font-size:11px;color:var(--tx3);line-height:1.7;margin-top:6px;padding-top:14px;border-top:.5px solid var(--line)}

  .toast{position:fixed;bottom:calc(20px + env(safe-area-inset-bottom));left:50%;transform:translateX(-50%);
    background:var(--tx);color:var(--bg);padding:10px 20px;border-radius:8px;font-size:13px;
    opacity:0;pointer-events:none;transition:opacity .2s;z-index:99;max-width:88vw;text-align:center}
  .toast.on{opacity:1}

  .modal{position:fixed;inset:0;background:rgba(0,0,0,.45);display:none;align-items:center;justify-content:center;padding:16px;z-index:100;overflow-y:auto}
  .modal.on{display:flex}
  .mbox{background:var(--card);border-radius:14px;padding:20px;max-width:480px;width:100%;max-height:88vh;overflow-y:auto}
  .mrow{display:flex;gap:8px;justify-content:flex-end;margin-top:16px;flex-wrap:wrap}
  .tgl{display:flex;align-items:center;gap:8px;cursor:pointer;font-size:13px;color:var(--tx);padding:6px 0}
  .tgl input{width:auto;flex:0 0 auto;margin:0}
  .slot{display:flex;gap:8px;align-items:center;margin-bottom:8px}
  .slot input{flex:0 0 130px}
  /* 落在可信时段外的时间点：设了也不会执行，必须让用户当场看见 */
  .slot input.bad{border-color:var(--red);background:var(--red-l)}
  #sWarn{color:var(--red);border-color:var(--red);background:var(--red-l)}
  .hintbox{font-size:11px;color:var(--tx3);line-height:1.7;background:var(--bg);border:.5px solid var(--line);border-radius:8px;padding:10px 12px;margin-top:4px}

  /* 采集管理：三段式，段间用细线分开，否则三块内容会糊成一团 */
  .mbox.wide{max-width:580px}
  .cmsec{padding:14px 0;border-top:.5px solid var(--line)}
  .cmsec:first-of-type{padding-top:2px;border-top:none}
  .cmh{font-size:12px;font-weight:500;margin-bottom:10px;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
  .cmh .dim{font-weight:400}
  .cmrow{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
  /* 历史采集日志：一行一条，变化明细压成小字，失败的单独标红 */
  .loglist{max-height:230px;overflow-y:auto}
  .logrow{padding:7px 0;border-bottom:.5px solid var(--line);font-size:12px}
  .logrow:last-child{border-bottom:none}
  .logrow .l1{display:flex;gap:8px;align-items:baseline;flex-wrap:wrap}
  .logrow .lt{color:var(--tx3);font-variant-numeric:tabular-nums;flex:0 0 auto}
  .logrow .l2{color:var(--tx3);font-size:11px;line-height:1.6;margin-top:2px;overflow-wrap:break-word}
  .logrow .lfail{color:var(--red);font-size:11px;line-height:1.6;margin-top:2px}
  .cmempty{font-size:12px;padding:8px 0}
  .parsehint{font-size:11px;line-height:1.6;margin-top:6px;min-height:0;overflow-wrap:break-word}
  .parsehint:empty{display:none}
  .parsehint .good{color:var(--teal);font-weight:500}
  .parsehint .bad{color:var(--red);font-weight:500}

  @media (max-width:640px) {
    body{padding:12px 10px 70px}
    h1{font-size:16px}
    header{margin-bottom:12px}
    .actions{width:100%}
    .actions button{flex:1 1 auto;padding:9px 12px}
    .kpis{grid-template-columns:1fr 1fr;gap:8px}
    .kv{font-size:19px}
    .card{padding:13px 14px;border-radius:10px}
    .grid2{grid-template-columns:1fr}
    table,thead,tbody,tr,td{display:block;width:100%}
    thead{display:none}
    tr{border-bottom:.5px solid var(--line);padding:10px 0}
    tr:last-child{border-bottom:none}
    td{border:none;padding:2px 0;text-align:left !important}
    td.num{text-align:left !important;display:inline-block;width:auto;margin-right:14px}
    td.num::before{content:attr(data-l) " ";color:var(--tx3);font-size:11px}
    td:last-child{margin-top:8px;padding-top:8px;border-top:.5px solid var(--line)}
    .hide-m{display:none !important}
    .ovtable .grow{padding:12px 0}
    .growname{font-size:14px;margin-bottom:2px}
    .mbox{padding:18px 16px}
  }

  /* 图表控件与图例 */
  .chartctl{display:flex;gap:6px;align-items:center;flex-wrap:wrap;justify-content:flex-end}
  .chartctl select{width:auto;max-width:190px;padding:3px 8px;font-size:12px}
  .legend{display:flex;flex-wrap:wrap;gap:10px 14px;margin:2px 0 10px;font-size:11px;color:var(--tx2)}
  .legend .lg{display:inline-flex;align-items:center;gap:5px;max-width:100%;overflow-wrap:break-word}
  .legend .lg i{width:9px;height:9px;border-radius:2px;flex:0 0 auto;display:inline-block}
  .legend .lgnote{color:var(--tx3);font-weight:400}

  /* 分层排行 */
  .rkrow{display:flex;align-items:center;gap:10px;padding:5px 0;cursor:default}
  .rkrow.clickable{cursor:pointer;border-radius:6px}
  .rkrow.clickable:hover{background:var(--bg)}
  .rkname{flex:0 0 112px;font-size:12px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .rkbar{flex:1 1 auto;min-width:0}
  .rkbar>div{height:15px;border-radius:3px}
  .rkval{flex:0 0 52px;text-align:right;font-size:12px;font-variant-numeric:tabular-nums}
  .rkcaret{flex:0 0 10px;font-size:10px;color:var(--tx3)}
  .rksub .rkrow{padding-left:16px}
  .rksub .rkname{flex:0 0 96px;font-size:11.5px;color:var(--tx2)}
  .rksub .rkbar>div{height:11px;opacity:.85}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div>
      <h1>小红书对标销量监控</h1>
      <div class="sub" id="subLine">正在加载…</div>
    </div>
    <div class="actions">
      <button class="ghost" id="btnManage">商品管理</button>
      <button class="primary" id="btnCollectMgr">采集管理</button>
    </div>
  </header>

  <div id="banner"></div>
  <div class="groupbar" id="groupBar"></div>
  <div class="kpis" id="kpis"></div>

  <div class="card" id="cmpCard" style="display:none">
    <div class="ch"><span id="cmpTitle">组内对比</span></div>
    <div id="cmpBox"></div>
  </div>

  <div class="card">
    <div class="ch">
      <span>监控商品 <span class="dim" id="prodCount" style="font-weight:400"></span></span>
      <span class="dim" style="font-weight:400;font-size:12px">窗口
        <select id="selDays" style="width:auto;padding:3px 8px;font-size:12px">
          <option value="1">1 天</option><option value="7" selected>7 天</option><option value="30">30 天</option>
        </select></span>
    </div>
    <div id="tableBox"></div>
  </div>

  <div class="grid2">
    <div class="card">
      <div class="ch" id="rankTitle">今日增量排行</div>
      <div id="rankBox"></div>
    </div>
    <div class="card">
      <div class="ch"><span>累计走势</span><span class="chartctl" id="chartCtl"></span></div>
      <div id="chartBox"></div>
      <div class="foot" id="chartFoot" style="border:none;padding-top:8px;margin-top:6px">曲线为页面公开「已售」累计值，非真实订单量</div>
    </div>
  </div>

  <!-- 周期内销量：回答"这段时间卖了多少"，和累计值互补，周期与累计走势共用 -->
  <div class="card" id="deltaCard">
    <div class="ch"><span id="deltaTitle">周期销量走势</span></div>
    <div id="deltaBox"></div>
  </div>

  <div class="card" id="priceCard">
    <div class="ch"><span id="priceTitle">实际卖价走势</span></div>
    <div id="priceBox"></div>
  </div>

  <div class="foot">
    <b>口径说明：</b>「累计已售」是商品页对访客公开展示的数字，<b>不等于真实订单量</b>。退款、平台展示延迟、口径调整、商品链接变更都可能影响数值。
    请仅用于趋势判断，不要作为财务报表或竞品算账依据。<br>
    工具只读取商品详情接口对所有人公开返回的数据，不修改原始内容、不绕过平台技术措施。
  </div>
</div>

<div class="modal" id="modal"><div class="mbox" id="mbox"></div></div>
<div class="toast" id="toast"></div>

<script src="chartkit.js"></script>
<script>
const $ = s => document.querySelector(s);
let state = null, autoTimer = null;
let wasCollecting = false;   // 用于判断采集「刚刚结束」，好弹一条完成提示
let collectMgrOpen = false;  // 采集管理弹窗是否开着：开着的话 refresh 要顺带刷新里面两段
let currentGroup = '';   // '' = 全部；组名 = 该组；'__UNGROUPED__' = 未分组
let chartGroup = '';     // 「全部」视图下选中的分组
let chartShop = '';      // 累计走势的店铺筛选，'' = 全部店铺
let chartPeriod = 'day'; // 统计周期：each/day/week/month，两张走势图共用

function toast(msg) {
  const t = $('#toast');
  t.textContent = msg; t.classList.add('on');
  clearTimeout(t._tm); t._tm = setTimeout(() => t.classList.remove('on'), 2600);
}
function esc(s) {
  return String(s == null ? '' : s).replace(/[<>&'"]/g, c => ({'<':'&lt;','>':'&gt;','&':'&amp;',"'":'&apos;','"':'&quot;'}[c]));
}
async function api(path, opts) {
  const r = await fetch(path, opts);
  const d = await r.json().catch(() => ({}));
  if (!r.ok || d.error) throw new Error(d.error || ('请求失败 ' + r.status));
  return d;
}
function fmt(n) { return n == null ? '—' : Number(n).toLocaleString(); }
function deltaTxt(v) { return v == null ? '—' : (v > 0 ? '+' + v : String(v)); }

// 今日增量：null 表示今天还没采过，不能显示成 0
function todayCell(v, cut) {
  if (v === null || v === undefined) return '<span class="dim" title="今天还没有采集记录">—</span>';
  /*
  今早首采低于昨夜时，基线改用今早那条，两数之差（cut）被排除在今日增量之外。
  这笔账不能悄悄吞掉：鼠标悬停要能看到，格子后面也标一个小记号。
  否则会出现「今日 +5」但累计其实比昨夜还低的情况，看着像在涨，实际在跌。
  */
  if (!cut) return deltaTxt(v);
  const tip = `今早首采比昨夜低 ${cut} 件，已改用它作今日基线，这笔下修未计入今日增量`;
  return `${deltaTxt(v)}<span class="cutmark" title="${esc(tip)}">↧${cut}</span>`;
}
function shortT(iso) {
  if (!iso) return '—';
  const d = new Date(iso);
  return (d.getMonth()+1) + '/' + d.getDate() + ' ' + String(d.getHours()).padStart(2,'0') + ':' + String(d.getMinutes()).padStart(2,'0');
}

// 组标签只用于「切换查看」，改名前/解散一律在「商品管理」里做，避免误操作
function renderGroupBar() {
  const gs = state.groups || [];
  const total = state.totals.products;
  const cur = currentGroup;

  const tabs = [`<div class="gtab ${cur === '' ? 'on' : ''}" data-g="">
    <span>全部</span><span class="cnt">${total}</span></div>`];

  for (const g of gs) {
    if (g.isUngrouped) continue;
    tabs.push(`<div class="gtab ${cur === g.name ? 'on' : ''}" data-g="${esc(g.name)}">
      <span class="gname" title="${esc(g.name)}">${esc(g.name)}</span>
      <span class="cnt">${g.count}</span>
    </div>`);
  }

  if (gs.some(g => g.isUngrouped)) {
    tabs.push(`<div class="gtab ${cur === '__UNGROUPED__' ? 'on' : ''}" data-g="__UNGROUPED__">
      <span>未分组</span><span class="cnt">${(gs.find(g => g.isUngrouped) || {}).count || 0}</span></div>`);
  }

  $('#groupBar').innerHTML = tabs.join('');

  $('#groupBar').querySelectorAll('.gtab[data-g]').forEach(el => {
    el.onclick = () => { currentGroup = el.dataset.g; render(); };
  });
}

// 当前选中组里的商品
function visibleProducts() {
  const ps = state.products;
  if (!currentGroup) return ps;
  if (currentGroup === '__UNGROUPED__') return ps.filter(p => !(p.group || '').trim());
  return ps.filter(p => (p.group || '').trim() === currentGroup);
}

// 组内横向对比：以「店铺」为单位（竞品对比看的是店，不是单个链接）
function renderCompare() {
  const box = $('#cmpCard');
  if (!currentGroup) { box.style.display = 'none'; return; }
  const key = currentGroup === '__UNGROUPED__' ? '未分组' : currentGroup;
  const g = (state.byShop || {})[key];
  if (!g || !g.shops.length) { box.style.display = 'none'; return; }
  box.style.display = '';

  const items = g.shops.filter(x => x.totalCumulative > 0 || x.totalDelta !== 0);
  const maxCum = Math.max(...items.map(x => x.totalCumulative), 1);

  $('#cmpTitle').innerHTML = `${esc(key)} · 店与店对比
    <span class="dim" style="font-weight:400;font-size:11px">
      ${g.shopCount} 家店铺 · ${g.productCount} 个商品${g.priceMin && g.priceMax ? ` · ¥${g.priceMin}~${g.priceMax}` : ''}
    </span>`;

  if (!items.length) {
    $('#cmpBox').innerHTML = '<div class="empty dim" style="padding:24px 0">该组商品还没有销量数据</div>';
    return;
  }

  // 右侧优先显示「今日增量」（用户主要看这个），今天没数据时退回最近一次增量
  const useToday = items.some(x => x.totalToday !== null && x.totalToday !== undefined);
  $('#cmpBox').innerHTML = `<div class="cmp">${items.map(x => {
    const w = (x.totalCumulative / maxCum) * 100;
    const dv = useToday ? x.totalToday : x.totalDelta;
    const dColor = dv > 0 ? 'var(--up)' : (dv < 0 ? 'var(--red)' : 'var(--tx3)');
    const price = x.priceMin != null
      ? (x.priceMin === x.priceMax ? `¥${x.priceMin}` : `¥${x.priceMin}~¥${x.priceMax}`)
      : '';
    return `<div class="cmprow">
      <div class="cmpname" title="${esc(x.shop)}">${esc(x.shop)}
        <span class="cmpshop">${x.count} 个商品${price ? ' · ' + price : ''}</span></div>
      <div class="cmpbar"><div style="height:17px;width:${Math.max(w, 1.5)}%;border-radius:3px;background:var(--teal-l)"></div></div>
      <div class="cmpval">${fmt(x.totalCumulative)}</div>
      <div class="cmpdelta" style="color:${dColor}">${dv == null ? '—' : (dv > 0 ? '+' : '') + dv}</div>
    </div>`;
  }).join('')}</div>
  <div class="foot" style="border:none;padding-top:8px;margin-top:4px">
    横向条长度 = 该店在组内的累计销量占比　右侧为店铺累计 / 店铺${useToday ? '今日增量' : '最近增量'}
  </div>`;
}

// 顶部副标题：把概况与自动采集状态压成一行，不再单独占版面
function renderSchedBar() {
  const sc = state.schedule;
  const t = state.totals;
  const parts = [];

  parts.push(`${t.products} 个商品`);
  const gcount = (state.groups || []).filter(g => !g.isUngrouped).length;
  if (gcount) parts.push(`${gcount} 个分组`);

  // 采集节奏：给「上次 / 下次」两个时间点，比列一遍定时时刻更有用
  const last = state.lastCollectAt ? shortT(state.lastCollectAt) : '暂无';
  parts.push(`上次采集 <b>${esc(last)}</b>`);
  if (sc.enabled) {
    if (sc.nextRunText) parts.push(`下次 <b>${esc(shortT(sc.nextRunText))}</b>`);
  } else {
    parts.push('<b>自动采集已关闭</b>');
  }

  const el = $('#subLine');
  if (!el) return;
  el.innerHTML = parts.join('　·　') +
    `　<span class="schedset" id="btnEditSched" title="自动采集设置">设置</span>`;
  const b = $('#btnEditSched');
  if (b) b.onclick = openCollectMgr;
}

// banner 只用于真正的异常，常态不占版面
function renderBanner() {
  const b = $('#banner');
  const j = state.job;

  if (state.collecting) {
    b.innerHTML = `<div class="banner ok"><span>正在${j.trigger === 'auto' ? '自动' : '手动'}采集…</span></div>`;
    return;
  }
  if (j.error) {
    b.innerHTML = `<div class="banner err"><span>上次采集出错：${esc(j.error)}</span></div>`;
    return;
  }
  // 最近一次采集有失败项才提示，全成功就不打扰
  const failed = (j.results || []).filter(r => !r.ok);
  if (failed.length) {
    // 失败原因像是接口/风控问题且没登录时，给出可操作的下一步
    const canFallback = !state.hasAuth && /风控|接口|登录|拦截|变更/.test(failed[0].failReason || '');
    b.innerHTML = `<div class="banner warn"><span>上次 ${failed.length} 个商品采集失败：${esc(failed[0].failReason || '')}${failed.length > 1 ? ' …' : ''}${canFallback ? '　→ 可点右上角 ⏰ 登录后启用浏览器回退' : ''}</span></div>`;
    return;
  }
  // 全部商品都没有有效数据（例如接口失效），才提示登录
  const noData = state.products.length > 0 && state.products.every(p => p.cumulative === null);
  if (noData && !state.hasAuth) {
    b.innerHTML = `<div class="banner warn"><span>采集不到数据，可点右上角 ⏰ 登录后启用浏览器回退</span></div>`;
    return;
  }
  b.innerHTML = '';
}

function renderKpis() {
  const t = state.totals;
  // 副标题由 renderSchedBar 统一生成，这里不再覆盖，避免两者打架
  $('#prodCount').textContent = t.products ? `(${t.products})` : '';

  // 选中某个组时，KPI 切换成该组口径
  if (currentGroup) {
    const key = currentGroup === '__UNGROUPED__' ? '未分组' : currentGroup;
    const g = (state.groupStats || {})[key];
    if (g) {
      const days = $('#selDays').value;
      $('#kpis').innerHTML = `
        <div class="kpi"><div class="kl">${esc(key)} · 商品数</div><div class="kv">${g.count}<span class="dim" style="font-size:12px;font-weight:400"> / ${g.shopCount} 店</span></div></div>
        <div class="kpi"><div class="kl">组内累计已售</div><div class="kv">${fmt(g.totalCumulative)}</div></div>
        <div class="kpi" title="今日增量 = 最新已售 − 今天 0 点前最后一次采集的已售"><div class="kl">今日增量</div><div class="kv ${g.totalToday > 0 ? 'pos' : ''}">${deltaTxt(g.totalToday)}</div></div>
        <div class="kpi"><div class="kl">近 ${days} 天增量</div><div class="kv ${g.totalWindow > 0 ? 'pos' : ''}">${deltaTxt(g.totalWindow)}</div></div>
        <div class="kpi" title="相邻两次采集之间的差值，只反映最近这一段"><div class="kl">最近一次增量</div><div class="kv sm" style="color:var(--tx2)">${deltaTxt(g.totalDelta)}</div></div>`;
      return;
    }
  }

  // 「全部」视图给概览型指标：组数、商品数、店铺数、采集时间
  // 不再显示混合合计（+1、+7 这种数字不指向任何具体决策）
  const gs = state.groups || [];
  const realGroups = gs.filter(g => !g.isUngrouped);
  const shopSet = new Set(state.products.map(p => p.shop).filter(Boolean));

  // 找出今日增量最大的组，给一个"当前最值得看的地方"。
  // 今天还没采到数据时，退回用「最近一次增量」并改标签，不硬报 0。
  let topGroup = null, topVal = 0, topBasis = 'today';
  for (const g of gs) {
    const gd = (state.groupStats || {})[g.name];
    if (gd && (gd.totalToday || 0) > topVal) { topVal = gd.totalToday; topGroup = g.name; }
  }
  if (!topGroup) {
    topBasis = 'delta';
    for (const g of gs) {
      const gd = (state.groupStats || {})[g.name];
      if (gd && (gd.totalDelta || 0) > topVal) { topVal = gd.totalDelta; topGroup = g.name; }
    }
  }
  const topLabel = topBasis === 'today' ? '今日增量最大的组' : '最近增量最大的组';

  $('#kpis').innerHTML = `
    <div class="kpi"><div class="kl">监控分组</div><div class="kv">${realGroups.length}${gs.some(g => g.isUngrouped) ? '<span class="dim" style="font-size:12px;font-weight:400"> + 未分组</span>' : ''}</div></div>
    <div class="kpi"><div class="kl">监控商品</div><div class="kv">${t.products}<span class="dim" style="font-size:12px;font-weight:400"> / ${shopSet.size} 店</span></div></div>
    <div class="kpi" title="今日增量 = 最新已售 − 今天 0 点前最后一次采集的已售"><div class="kl">今日增量</div><div class="kv ${t.today > 0 ? 'pos' : ''}">${deltaTxt(t.today)}</div></div>
    <div class="kpi"><div class="kl">${topLabel}</div><div class="kv sm" style="font-size:14px">${topGroup ? esc(topGroup) + ' <span style="color:var(--up)">+' + topVal + '</span>' : '<span class="dim">暂无增量</span>'}</div></div>`;
}

/* ---------- 采集管理 ----------
手动采集、周期设置、采集日志，三件事集中在一个入口。
原来它们散在主界面：按钮在顶栏、进度卡片挂在页面底部。
主界面是看数据的地方，过程信息挤在里头既占版面又没人看。
*/

function jobLine(r) {
  const via = r.via === 'api' ? '接口' : (r.via && r.via.startsWith('browser') ? '浏览器' : '');
  const tag = via ? `<span class="dim"> [${via}]</span>` : '';
  return r.ok
    ? `<div class="ok">✓ ${esc(r.name)}${tag}　已售 ${fmt(r.soldTotal)}${r.delta != null ? `　(${deltaTxt(r.delta)})` : '　(建立基线)'}</div>`
    : `<div class="no">✗ ${esc(r.name)}${tag}　${esc(r.failReason || '失败')}</div>`;
}

// 第一段：手动采集 + 本次进度明细
function cmRunHtml() {
  const j = state.job || {};
  const last = state.lastCollectAt ? shortT(state.lastCollectAt) : '暂无';
  const btn = j.running
    ? `<button class="primary" disabled>采集中 ${j.done || 0}/${j.total || 0}</button>`
    : `<button class="primary" id="cmRunNow">立即采集</button>`;
  const pct = j.running && j.total ? Math.round((j.done / j.total) * 100) : 100;
  const prog = (j.running || (j.results || []).length)
    ? `<div class="prog"><i style="width:${pct}%"></i></div>` : '';
  const res = j.results || [];
  const detail = res.length
    ? `<div class="log">${res.slice().reverse().map(jobLine).join('')}${j.error ? `<div class="no">错误：${esc(j.error)}</div>` : ''}</div>`
    : `<div class="cmempty dim">${j.running ? '正在采集…' : '点「立即采集」刷新一次所有商品的销量'}</div>`;
  return `<div class="cmh">立即采集 <span class="dim" style="font-weight:400">上次 ${esc(last)}</span></div>
    <div class="cmrow">${btn}${j.running && j.current
      ? `<span class="dim" style="font-size:12px">${esc(j.current)}</span>` : ''}</div>
    ${prog}${detail}`;
}

// 第三段：历史采集日志
function cmLogHtml() {
  const log = state.autoLog || [];
  if (!log.length) return '<div class="cmh">采集日志</div><div class="cmempty dim">还没有记录</div>';
  return `<div class="cmh">采集日志 <span class="dim" style="font-weight:400">最近 ${log.length} 次</span></div>
    <div class="loglist">${log.map(cmLogRow).join('')}</div>`;
}

function cmLogRow(e) {
  const d = new Date(e.at);
  const p2 = n => String(n).padStart(2, '0');
  const when = `${d.getMonth() + 1}/${d.getDate()} ${p2(d.getHours())}:${p2(d.getMinutes())}`;
  const how = e.trigger === 'auto' ? (e.slot ? `自动·${e.slot}` : '自动') : '手动';
  const res = e.error
    ? `<span class="no">整轮失败</span>`
    : (e.failed
      ? `<span class="no">${e.ok || 0}/${e.total}</span>　<span class="dim">${e.failed} 个失败</span>`
      : `<span class="ok">${e.ok}/${e.total} 成功</span>`);
  const chg = e.changes || [];
  const chgTxt = chg.length
    ? `<div class="l2">${esc(chg.slice(0, 6).join(' · '))}${chg.length > 6 ? ` 等 ${chg.length} 项` : ''}</div>` : '';
  const failTxt = (e.fails || []).length
    ? `<div class="lfail">✗ ${esc(e.fails.join('；'))}</div>`
    : (e.error ? `<div class="lfail">✗ ${esc(e.error)}</div>` : '');
  /* 手动采集不受可信时段限制（用户主动点的就该执行），但凌晨读到的数是旧快照。
     事后看到数据怪，日志里得有个说法，不然无从查起。 */
  const warn = e.outsideWindow
    ? `<span class="tag p" title="这次采集落在可信时段外，读到的可能是平台返回的旧快照">窗口外</span>` : '';
  return `<div class="logrow">
    <div class="l1"><span class="lt">${esc(when)}</span><span>${esc(how)}</span>${res}${warn}</div>
    ${chgTxt}${failTxt}</div>`;
}

async function openCollectMgr() {
  const sc = await api('/api/schedule').catch(() => null);
  if (!sc) return toast('读取采集设置失败');
  collectMgrOpen = true;
  openModal(`
    <div class="ch">采集管理</div>
    <div class="cmsec" id="cmRun">${cmRunHtml()}</div>
    <div class="cmsec" id="cmSched">${cmSchedHtml(sc)}</div>
    <div class="cmsec" id="cmLog">${cmLogHtml()}</div>
    <div class="mrow"><button class="primary" id="cmClose">关闭</button></div>`, true);
  bindCmRun();
  bindCmSched(sc);
  $('#cmClose').onclick = closeModal;
}

function bindCmRun() {
  const b = $('#cmRunNow');
  if (!b) return;
  b.onclick = async () => {
    b.disabled = true; b.textContent = '启动中…';
    try {
      await api('/api/collect', { method: 'POST', body: '{}' });
      toast('开始采集');
      // 刷新后 renderCollectMgr 会把按钮换成进度文案，这里不用再管
      await refresh();
    } catch (e) { toast(e.message); b.disabled = false; b.textContent = '立即采集'; }
  };
}

/*
弹窗开着时跟着刷新：进度要动、日志要更新。
但只重绘这两段——不碰设置段，用户可能正改到一半的时间槽，一刷就把输入吃掉了。
*/
function renderCollectMgr() {
  if (!collectMgrOpen) return;
  const r = $('#cmRun'), l = $('#cmLog');
  if (!r || !l) return;          // 弹窗被别的弹窗顶掉了
  r.innerHTML = cmRunHtml();
  l.innerHTML = cmLogHtml();
  bindCmRun();
}

function renderTable() {
  // 「全部」视图：按分组聚合，一眼看哪个品在起量
  if (!currentGroup) { renderGroupOverview(); return; }
  renderProductTable();
}

/* ---------- 全部视图：分组概览 ---------- */
function renderGroupOverview() {
  const gs = state.groups || [];
  if (!gs.length) {
    $('#tableBox').innerHTML = `<div class="empty"><b>还没有监控商品</b>
      点右上角「商品管理」→「商品管理」页签 → 「+ 添加监控商品」<br>
      <span style="font-size:11px">粘贴小红书商品链接即可，名称、店铺、价格会自动识别</span></div>`;
    return;
  }

  const rows = gs.map(g => {
    const key = g.isUngrouped ? '未分组' : g.name;
    const d = (state.groupStats || {})[key] || {};
    const items = d.items || [];
    const shops = [...new Set(items.map(x => x.shop).filter(Boolean))];
    // 今日组内最热：按「今日增量」排名，日内谁在跑才是用户真正关心的
    // 不用最近增量——它只是相邻两次采集的差，跨过 0 点就会被日切修正干扰
    const hottest = items.filter(x => (x.todayDelta || 0) > 0)
      .sort((a, b) => b.todayDelta - a.todayDelta)[0];
    const noData = items.length > 0 && items.every(x => x.cumulative === null);

    const priceTxt = (d.priceMin != null && d.priceMax != null)
      ? (d.priceMin === d.priceMax ? `¥${d.priceMin}` : `¥${d.priceMin}~${d.priceMax}`)
      : '—';

    return `<tr class="grow" data-g="${esc(g.isUngrouped ? '__UNGROUPED__' : g.name)}">
      <td class="nm" data-l="分组">
        <div class="growname">${esc(key)}${g.isUngrouped ? '' : ''}</div>
        <div class="sh">${items.length ? items.slice(0, 3).map(x => esc(x.shop || '未知店铺')).join('、') + (items.length > 3 ? ` 等 ${items.length} 家` : '') : '还没有商品'}</div>
      </td>
      <td class="num" data-l="商品">${g.count}<span class="dim"> / ${shops.length} 店</span></td>
      <td class="num" data-l="累计">${d.totalCumulative ? fmt(d.totalCumulative) : (noData ? '<span class="dim">待采集</span>' : '—')}</td>
      <td class="num ${d.totalToday > 0 ? 'up' : ''}" data-l="今日">${items.length ? deltaTxt(d.totalToday) : '—'}</td>
      <td class="num dim hide-m" data-l="窗口">${items.length ? deltaTxt(d.totalWindow) : '—'}</td>
      <td class="num dim" data-l="最近">${items.length ? deltaTxt(d.totalDelta) : '—'}</td>
      <td class="num dim" data-l="价格">${priceTxt}</td>
      <td class="sh hide-m" data-l="今日最热">${!items.length
        ? '<span class="dim">—</span>'
        : (hottest
            ? `<span title="今日 +${hottest.todayDelta} · ${esc(hottest.name || '')}">${esc(hottest.shop || hottest.name || '')} <b style="color:var(--up)">+${hottest.todayDelta}</b></span>`
            : '<span class="dim" title="今天这些商品都还没有新增销量">今日无增长</span>')}</td>
      <td class="dim" style="white-space:nowrap;text-align:right"><span class="growgo">明细 ›</span></td>
    </tr>`;
  }).join('');

  $('#tableBox').innerHTML = `<table class="ovtable">
    <thead><tr>
      <th class="num">分组</th><th class="num">商品</th><th class="num">累计已售</th><th class="num">今日增量</th>
      <th class="num hide-m">窗口增量</th><th class="num">最近增量</th><th class="num">价格</th><th class="hide-m">今日组内最热</th><th></th>
    </tr></thead>
    <tbody>${rows}</tbody></table>
    <div class="foot" style="border:none;padding-top:10px;margin-top:4px">
      这是各组汇总。点任意一行进入该组，看组内各店铺的横向明细。
    </div>`;

  $('#tableBox').querySelectorAll('.grow').forEach(tr => {
    tr.onclick = () => { currentGroup = tr.dataset.g; render(); };
  });
}

/* ---------- 单元格小工具 ---------- */
function cumCell(p) {
  if (p.cumulative === null || p.cumulative === undefined) return '<span class="dim">—</span>';
  if (!p.soldApprox) return fmt(p.cumulative);
  /*
  高销量商品的「已售」是取整显示的（实测「已售5.4万+」），
  解析出来的 54000 只是那个档位的下界，真实值可能还多几百件。
  不标出来的话，日增量长期显示 0，很容易被误读成"这品不动了"。
  */
  const step = p.soldStep ? `，平台按 ${fmt(p.soldStep)} 件一档` : '';
  return `<span title="平台只显示取整值（${fmt(p.cumulative)} 起）${step}；真实增量要跨过这一档才会体现">` +
    `≈${fmt(p.cumulative)}<span class="dim">*</span></span>`;
}

function deltaCell(p) {
  if (p.delta == null) {
    // 只有基线时明确说明原因，而不是干巴巴一个破折号
    return p.samples <= 1
      ? '<span class="dim" style="font-size:11px">待下次采集</span>'
      : '<span class="dim">—</span>';
  }
  const sign = p.delta > 0 ? '+' : '';
  // 负数多半是平台在日切剔除退款，不是采集出错，措辞别吓人
  return `${sign}${p.delta}` +
    (p.suspicious ? ' <span class="tag" title="本次采集的数字比上次小，通常是平台剔除退款/取消单">修正</span>' : '');
}

function priceInline(p) {
  if (p.price == null) return '';
  // 有优惠时：到手价 + 划线价，一眼看出真实成交价
  if (p.priceHasPromo && p.priceOriginal) {
    return ` · <b style="color:var(--up)">¥${p.price}</b> <s class="dim">¥${p.priceOriginal}</s>`;
  }
  return ` · ¥${p.price}`;
}

function perHourCell(p) {
  if (p.perHour == null) return '—';
  if (p.perHourReliable === false) {
    // 间隔不足 45 分钟，外推值不可靠，标出来避免误读
    return `<span title="两次记录间隔仅 ${p.hours} 小时，外推值仅供参考">${p.perHour.toFixed(1)}<span class="dim">*</span></span>`;
  }
  return p.perHour.toFixed(1);
}

/* ---------- 组视图：按「店铺 → 商品」两层展示 ---------- */
let collapsedShops = {};   // { '组名|店铺名': true } 折叠状态

function renderProductTable() {
  const key = currentGroup === '__UNGROUPED__' ? '未分组' : currentGroup;
  const g = (state.byShop || {})[key];

  if (!g || !g.shops.length) {
    $('#tableBox').innerHTML = `<div class="empty"><b>该分组下还没有商品</b>
      去「商品管理」→「商品管理」里添加，或把已有商品调进来<br>
      <span style="font-size:11px">点「全部」可以看到其他分组</span></div>`;
    return;
  }

  const rows = g.shops.map(sh => {
    const ck = key + '|' + sh.shop;
    const collapsed = !!collapsedShops[ck];
    const multi = sh.count > 1;
    const priceTxt = sh.priceMin != null
      ? (sh.priceMin === sh.priceMax ? `¥${sh.priceMin}` : `¥${sh.priceMin}~¥${sh.priceMax}`)
      : '';

    // 店铺汇总行：店铺名优先、字号更大，一眼看到"这家店"的数据
    const head = `<tr class="shoprow ${collapsed ? 'collapsed' : ''}" data-shop="${esc(sh.shop)}" data-key="${esc(ck)}">
      <td class="nm" data-l="店铺">
        <div class="shopline">
          ${multi ? `<span class="caret">${collapsed ? '▸' : '▾'}</span>` : '<span class="caret ph"></span>'}
          <span class="shopname">${sh.shopUrl ? `<a href="${esc(sh.shopUrl)}" target="_blank" rel="noopener">${esc(sh.shop)}</a>` : esc(sh.shop)}</span>
          <span class="shopcnt">${sh.count} 个商品</span>
        </div>
      </td>
      <td class="num shopnum" data-l="店铺累计">${sh.totalCumulative ? fmt(sh.totalCumulative) : '—'}</td>
      <td class="num shopnum ${sh.totalToday > 0 ? 'up' : ''}" data-l="今日">${todayCell(sh.totalToday)}</td>
      <td class="num dim shopnum" data-l="最近">${deltaTxt(sh.totalDelta)}</td>
      <td class="num dim shopnum hide-m" data-l="窗口">${deltaTxt(sh.totalWindow)}</td>
      <td class="num dim shopnum" data-l="价格">${priceTxt || '—'}</td>
      <td class="dim" data-l="记录">${sh.products.reduce((a, x) => a + x.samples, 0)} 次${sh.failCount ? ` <span class="tag p">失败${sh.failCount}</span>` : ''}</td>
      <td></td>
    </tr>`;

    // 商品明细行：缩进显示，店铺名不再重复
    const subs = collapsed ? '' : sh.products.map(p => `<tr class="prodrow">
      <td class="nm" data-l="商品">
        <div class="prodline">${esc(p.name)}</div>
        <div class="sh">${p.url ? `<a href="${esc(p.url)}" target="_blank" rel="noopener">商品页</a>` : ''}${priceInline(p)}</div>
      </td>
      <td class="num" data-l="累计">${cumCell(p)}</td>
      <td class="num ${p.todayDelta > 0 ? 'up' : ''}" data-l="今日">${todayCell(p.todayDelta, p.todayCut)}</td>
      <td class="num dim" data-l="最近">${deltaCell(p)}</td>
      <td class="num dim hide-m" data-l="窗口">${deltaTxt(p.cumulativeInWindow)}</td>
      <td class="num dim" data-l="件/时">${perHourCell(p)}</td>
      <td class="dim" data-l="样本">${p.samples} 次${p.failedRuns ? ` <span class="tag p">失败${p.failedRuns}</span>` : ''}</td>
      <td style="white-space:nowrap">
        <button class="sm ghost" data-act="rec" data-id="${esc(p.id)}">补录</button>
        <button class="sm ghost" data-act="his" data-id="${esc(p.id)}">历史</button>
      </td>
    </tr>`).join('');

    return head + subs;
  }).join('');

  $('#tableBox').innerHTML = `<table class="shoptable">
    <thead><tr>
      <th>店铺 / 商品</th><th class="num">累计已售</th><th class="num">今日增量</th><th class="num">最近增量</th>
      <th class="num hide-m">窗口增量</th><th class="num">价格</th><th>记录</th><th></th>
    </tr></thead>
    <tbody>${rows}</tbody></table>
    <div class="foot" style="border:none;padding-top:10px;margin-top:4px">
      按店铺汇总，展开可看该店在组内的每个商品。点店铺行可折叠 / 展开。
    </div>`;

  // 点击店铺行折叠 / 展开（有多个商品时才可折叠）
  $('#tableBox').querySelectorAll('.shoprow').forEach(tr => {
    tr.onclick = (e) => {
      if (e.target.closest('button')) return;
      const k = tr.dataset.key;
      collapsedShops[k] = !collapsedShops[k];
      render();
    };
  });
  $('#tableBox').querySelectorAll('button[data-act]').forEach(btn => {
    btn.onclick = () => {
      const id = btn.dataset.id;
      if (btn.dataset.act === 'rec') openRecord(id);
      else if (btn.dataset.act === 'his') openHistory(id);
    };

}

/* ---------- 今日增量排行：分组 → 店铺 →（组内）商品 ---------- */
let rankOpen = '';   // 'g:组名' 或 's:组名|店铺名'，同一时刻只展开一个

function barRow(o) {
  const v = o.val;
  const pct = Math.min(100, (Math.abs(v == null ? 0 : v) / (o.max || 1)) * 100);
  const color = v == null ? 'var(--tx3)' : (v < 0 ? 'var(--red)' : 'var(--teal-l)');
  const txt = v == null ? '—' : ((v > 0 ? '+' : '') + v);
  return `<div class="rkrow ${o.clickable ? 'clickable' : ''}" ${o.key ? `data-rk="${esc(o.key)}"` : ''} title="${esc(o.title || o.label)}">
    <span class="rkcaret">${o.caret || ''}</span>
    <span class="rkname">${esc(o.label)}</span>
    <span class="rkbar"><div style="width:${Math.max(pct, 1.5)}%;background:${color}"></div></span>
    <span class="rkval">${txt}</span>
  </div>`;
}

const shortProd = n => ChartKit.shortName(n, 9);

function renderRank() {
  const useToday = state.products.some(p => p.todayDelta !== null && p.todayDelta !== undefined);
  const title = $('#rankTitle');
  if (title) title.textContent = useToday ? '今日增量排行' : '增量排行（最近一次）';
  const pickG = g => useToday ? g.totalToday : g.totalDelta;
  const pickS = s => useToday ? s.totalToday : s.totalDelta;
  const pickP = p => useToday ? p.todayDelta : p.delta;
  const box = $('#rankBox');
  const emptyHtml = `<div class="empty dim" style="padding:26px 0">${useToday ? '今日还没有增量' : '还没有增量数据'}<br>采集两次以上才会显示</div>`;

  // 组内：先按店铺，点店铺再展开该店商品
  if (currentGroup) {
    const key = currentGroup === '__UNGROUPED__' ? '未分组' : currentGroup;
    const g = (state.byShop || {})[key];
    if (!g || !g.shops.length) { box.innerHTML = emptyHtml; return; }

    const shops = g.shops.map(sh => ({ ...sh, val: pickS(sh) }))
      .sort((a, b) => (b.val ?? -1e9) - (a.val ?? -1e9));
    const max = Math.max(...shops.map(x => Math.abs(x.val ?? 0)), 1);

    box.innerHTML = shops.map(sh => {
      const ck = 's:' + key + '|' + sh.shop;
      const open = rankOpen === ck;
      const row = barRow({
        label: sh.shop, val: sh.val, max,
        caret: sh.count > 1 ? (open ? '▾' : '▸') : '',
        clickable: sh.count > 1, key: ck,
        title: `${sh.shop} · ${sh.count} 个商品`
      });
      if (!open || sh.count < 2) return row;
      const prods = sh.products.map(p => ({ ...p, val: pickP(p) }))
        .sort((a, b) => (b.val ?? -1e9) - (a.val ?? -1e9));
      const pmax = Math.max(...prods.map(x => Math.abs(x.val ?? 0)), 1);
      return row + `<div class="rksub">${prods.map(p =>
        barRow({ label: shortProd(p.name), val: p.val, max: pmax, title: p.name })).join('')}</div>`;
    }).join('');
    bindRankClicks();
    return;
  }

  // 全部：先按分组，点分组再展开该组店铺
  const groups = (state.groups || []).filter(g => g.count > 0).map(g => {
    const key = g.isUngrouped ? '未分组' : g.name;
    const st = (state.groupStats || {})[key] || {};
    return { key, name: key, val: pickG(st), count: g.count, shops: ((state.byShop || {})[key] || {}).shops || [] };
  }).sort((a, b) => (b.val ?? -1e9) - (a.val ?? -1e9));

  if (!groups.length) { box.innerHTML = emptyHtml; return; }
  const max = Math.max(...groups.map(g => Math.abs(g.val ?? 0)), 1);

  box.innerHTML = groups.map(g => {
    const ck = 'g:' + g.key;
    const open = rankOpen === ck;
    const row = barRow({
      label: g.name, val: g.val, max,
      caret: open ? '▾' : '▸', clickable: true, key: ck,
      title: `${g.name} · ${g.count} 个商品`
    });
    if (!open) return row;
    const shops = g.shops.map(sh => ({ ...sh, val: pickS(sh) }))
      .sort((a, b) => (b.val ?? -1e9) - (a.val ?? -1e9));
    const smax = Math.max(...shops.map(x => Math.abs(x.val ?? 0)), 1);
    return row + `<div class="rksub">${shops.map(sh =>
      barRow({ label: sh.shop, val: sh.val, max: smax, title: `${sh.shop} · ${sh.count} 个商品` })).join('')}</div>`;
  }).join('');
  bindRankClicks();
}

function bindRankClicks() {
  $('#rankBox').querySelectorAll('.rkrow[data-rk]').forEach(el => {
    el.onclick = () => {
      const k = el.dataset.rk;
      rankOpen = rankOpen === k ? '' : k;
      renderRank();
    };
  });
}

/* ---------- 累计走势：多店铺 / 多商品多折线 ---------- */
function pickTopGroup(groups) {
  // 默认看「今日增量最多」的组；今天都没数据时退回最近增量
  const val = (g, f) => { const st = (state.groupStats || {})[g.name] || {}; const v = st[f]; return v == null ? -1 : v; };
  const byToday = [...groups].sort((a, b) => val(b, 'totalToday') - val(a, 'totalToday'));
  if (val(byToday[0], 'totalToday') > 0) return byToday[0].name;
  const byLast = [...groups].sort((a, b) => val(b, 'totalDelta') - val(a, 'totalDelta'));
  return byLast[0].name;
}

async function renderChart() {
  const box = $('#chartBox'), ctl = $('#chartCtl');
  const realGroups = (state.groups || []).filter(g => !g.isUngrouped && g.count > 0);

  let groupKey;
  if (currentGroup) {
    groupKey = currentGroup === '__UNGROUPED__' ? '未分组' : currentGroup;
  } else {
    if (!realGroups.length) {
      box.innerHTML = '<div class="empty dim" style="padding:26px 0">添加商品后显示走势</div>';
      ctl.innerHTML = '';
      renderDelta([]);
      return;
    }
    if (!chartGroup || !realGroups.some(g => g.name === chartGroup)) chartGroup = pickTopGroup(realGroups);
    groupKey = chartGroup;
  }

  const gd = (state.byShop || {})[groupKey];
  if (!gd || !gd.shops.length) {
    box.innerHTML = '<div class="empty dim" style="padding:26px 0">该分组下还没有商品</div>';
    ctl.innerHTML = '';
    renderDelta([]);
    return;
  }

  const shopNames = gd.shops.map(s => s.shop);
  if (chartShop && !shopNames.includes(chartShop)) chartShop = '';

  // 控件：「全部」多一个分组下拉（不含"全部"选项）；周期和店铺两张走势图共用
  ctl.innerHTML =
    (!currentGroup
      ? `<select id="selChartGroup" title="分组">${realGroups.map(g =>
          `<option value="${esc(g.name)}" ${g.name === groupKey ? 'selected' : ''}>${esc(g.name)}</option>`).join('')}</select>`
      : '') +
    `<select id="selChartShop" title="店铺"><option value="">全部店铺</option>${shopNames.map(n =>
      `<option value="${esc(n)}" ${n === chartShop ? 'selected' : ''}>${esc(n)}</option>`).join('')}</select>` +
    `<select id="selPeriod" title="统计周期">${ChartKit.PERIODS.map(p =>
      `<option value="${p}" ${p === chartPeriod ? 'selected' : ''}>${ChartKit.PERIOD_TEXT[p]}</option>`).join('')}</select>`;

  // 周/月要看更长的窗口，否则只有一两个点
  const d = await api('/api/chart?days=' + ChartKit.periodDays(chartPeriod)).catch(() => null);
  const sm = d ? (d.series || {}) : {};

  const series = [];
  let ci = 0;
  if (chartShop) {
    const sh = gd.shops.find(s => s.shop === chartShop);
    if (sh.count === 1) {
      // 店内只有一个商品：不必重复画汇总线
      const p = sh.products[0];
      series.push({ name: sh.shop, points: sm[p.id] || [], color: ChartKit.color(ci++) });
    } else {
      sh.products.forEach(p => series.push({
        name: ChartKit.shortName(p.name, 9), points: sm[p.id] || [], color: ChartKit.color(ci++)
      }));
      const sum = ChartKit.sumSeries(sh.products.map(p => sm[p.id] || []));
      if (sum.length) series.push({ name: '店铺汇总', points: sum, color: 'var(--tx2)' });
    }
  } else {
    // 默认：一家店一条线（店内多商品则求和），店只有 1 个商品时就是那条商品线
    gd.shops.forEach(sh => {
      const pts = sh.count === 1
        ? (sm[sh.products[0].id] || [])
        : ChartKit.sumSeries(sh.products.map(p => sm[p.id] || []));
      series.push({ name: sh.shop, points: pts, color: ChartKit.color(ci++) });
    });
  }

  // 按周期聚合：每个周期只留一个点（取该周期内最后一次采集的累计值）
  const usable = series
    .map(s => ({ ...s, points: ChartKit.cumulativeByPeriod(s.points, chartPeriod) }))
    .filter(s => s.points.length);

  const fmtX = t => ChartKit.fmtBucket(t, chartPeriod);
  if (!usable.length) {
    box.innerHTML = `<div class="empty"><b>还没有${ChartKit.PERIOD_TEXT[chartPeriod]}数据</b>
      该分组下还没有可绘制的记录<br>
      <span style="font-size:11px">也可以到「采集管理」手动采一次</span></div>`;
  } else {
    const maxPts = Math.max(...usable.map(s => s.points.length));
    const svg = ChartKit.lineSvg(usable, { values: true, fmtX });
    box.innerHTML = `<div class="legend">${ChartKit.legend(usable)}</div>` +
      (svg || '') +
      (maxPts < 2 ? `<div class="foot" style="border:none;padding-top:8px;margin-top:4px">
        目前每个序列只有 1 个${ChartKit.PERIOD_TEXT[chartPeriod]}的点${usable.length > 1 ? '' : '（一条基线）'}，再过一个周期就能连成线</div>` : '');
  }

  // 口径要写清楚：点位不是原始采集点，而是按周期聚合后的
  const cf = $('#chartFoot');
  if (cf) cf.textContent = `按${ChartKit.PERIOD_TEXT[chartPeriod]}取点（周期内取最后一次采集）；曲线为页面公开「已售」累计值，非真实订单量`;

  // 周期销量走势用未聚合的原始点，自己按周期算增量
  renderDelta(series);

  const g1 = $('#selChartGroup');
  if (g1) g1.onchange = () => { chartGroup = g1.value; chartShop = ''; renderChart(); };
  const g2 = $('#selChartShop');
  if (g2) g2.onchange = () => { chartShop = g2.value; renderChart(); };
  const g3 = $('#selPeriod');
  if (g3) g3.onchange = () => { chartPeriod = g3.value; renderChart(); };
}

/* ---------- 周期销量走势：这段时间内卖了多少（增量），与累计值互补 ---------- */
function renderDelta(series) {
  const card = $('#deltaCard'), box = $('#deltaBox');
  if (!card || !box) return;

  const usable = series
    .map(s => ({ ...s, points: ChartKit.deltaByPeriod(s.points, chartPeriod) }))
    .filter(s => s.points.length);

  const title = $('#deltaTitle');
  if (title) title.textContent = `周期销量走势 · ${ChartKit.PERIOD_TEXT[chartPeriod]}`;

  if (!usable.length) {
    box.innerHTML = `<div class="empty"><b>还看不出${ChartKit.PERIOD_TEXT[chartPeriod]}的销量</b>
      同一周期内至少要有两次采集才能算出增量<br>
      <span style="font-size:11px">多等一次采集，或把周期切到「每次采集」先看单次变化</span></div>`;
    return;
  }

  const svg = ChartKit.lineSvg(usable, {
    values: true,
    fmtX: t => ChartKit.fmtBucket(t, chartPeriod),
    // 增量一般是小整数，直接取整并带符号，比"1.2万"直观
    fmtV: v => (v > 0 ? '+' : '') + String(Math.round(v))
  });
  const total = usable.reduce((a, s) => a + s.points.reduce((x, p) => x + p.v, 0), 0);
  const hasFirst = usable.some(s => s.points.some(p => p.firstBasis));
  box.innerHTML = `<div class="legend">${ChartKit.legend(usable)}</div>` + (svg || '') +
    `<div class="foot" style="border:none;padding-top:8px;margin-top:6px">
      每个点 = 该${ChartKit.PERIOD_TEXT[chartPeriod]}区间内新增的销量（本期累计 − 上期累计）
      　区间合计 <b>${total > 0 ? '+' : ''}${Math.round(total)}</b><br>
      ${hasFirst ? `空心点「≈」是第一个${ChartKit.PERIOD_TEXT[chartPeriod]}：之前没有基线，按期内首次采集起算，仅供参考　` : ''}
      0 点前后读数可能短暂偏低（读到了平台的旧数据），这类读数会被自动剔除；只有一直没涨回去的才算真实回调
    </div>`;
}

/* ---------- 实际卖价走势：组内所有商品放进一张阶梯图 ---------- */
async function renderPrices() {
  const card = $('#priceCard');
  // 「全部」视图不展示价格走势
  if (!currentGroup) { card.style.display = 'none'; return; }

  const key = currentGroup === '__UNGROUPED__' ? '未分组' : currentGroup;
  const gd = (state.byShop || {})[key];
  if (!gd || !gd.shops.length) { card.style.display = 'none'; return; }
  card.style.display = '';

  const d = await api('/api/prices?days=90').catch(() => null);
  const prices = d ? (d.prices || {}) : {};

  const series = [];
  let ci = 0;
  for (const sh of gd.shops) {
    const multi = sh.count > 1;
    for (const p of sh.products) {
      const info = prices[p.id];
      if (!info || !info.series || !info.series.length) continue;
      // 店内多商品：「店铺·商品短名」；单商品：只显示店铺名，避免名字过长
      const label = multi
        ? `${ChartKit.shortName(sh.shop, 6)}·${ChartKit.shortName(p.name, 6)}`
        : ChartKit.shortName(sh.shop, 12);
      const cur = info.current && info.current.price != null ? `¥${info.current.price}` : '';
      series.push({
        name: label,
        points: info.series.map(x => ({ t: x.ts, v: x.price })),
        color: ChartKit.color(ci++),
        note: cur
      });
    }
  }

  $('#priceTitle').innerHTML = `实际卖价走势 · ${esc(key)}
    <span class="dim" style="font-weight:400;font-size:11px">${gd.productCount} 个商品 · ${gd.shopCount} 家店铺</span>`;

  if (!series.length) {
    $('#priceBox').innerHTML = `<div class="empty"><b>还没有价格记录</b>下次采集开始会记录到手价<br>
      <span style="font-size:11px">此前采集的只有划线价，为避免假跳变已标记为未采集</span></div>`;
    return;
  }

  const lasts = series.map(s => s.points[s.points.length - 1].v).filter(v => typeof v === 'number');
  const min = Math.min(...lasts), max = Math.max(...lasts);
  const head = `<div style="display:flex;align-items:baseline;gap:12px;flex-wrap:wrap;margin-bottom:10px">
    <div style="font-size:22px;font-weight:500;font-variant-numeric:tabular-nums">${min === max ? `¥${min}` : `¥${min} ~ ¥${max}`}</div>
    <div style="font-size:11px;color:var(--tx2)">当前到手价${series.length > 1 ? '区间' : ''}</div>
    <div class="dim" style="font-size:11px">到手价 = 划线价减去商家券/立减后的实付价</div>
  </div>`;

  const svg = ChartKit.stepSvg(series);
  let chart;
  if (svg) chart = svg;
  else chart = '<div class="empty dim" style="padding:22px 0">价格还没有变化过<br><span style="font-size:11px">有变更时会自动记录并画出阶梯</span></div>';

  // 只有一个序列时才展开变更明细，多个商品时明细太长
  let changeBlock = '';
  if (series.length === 1) {
    const only = gd.shops.flatMap(s => s.products).find(p => prices[p.id] && prices[p.id].series.length);
    const info = only ? prices[only.id] : null;
    const rows = (info ? info.changes : []).filter(c => c.delta !== null).map(c => {
      const up = c.delta > 0;
      return `<div style="display:flex;gap:10px;font-size:12px;padding:5px 0;border-bottom:.5px solid var(--line)">
        <span class="dim" style="flex:0 0 92px">${esc(shortT(c.ts))}</span>
        <span style="flex:0 0 90px">¥${c.from} → <b>¥${c.price}</b></span>
        <span style="flex:0 0 60px;color:${up ? 'var(--red)' : 'var(--teal)'}">${up ? '↑' : '↓'} ¥${Math.abs(c.delta)}</span>
        <span class="dim" style="flex:1 1 auto">${c.promos && c.promos[0] ? esc(c.promos[0].tag || c.promos[0].name || '') : ''}</span>
      </div>`;
    }).join('');
    if (rows) changeBlock = `<div style="margin-top:12px"><div style="font-size:11px;color:var(--tx2);margin-bottom:4px">价格变更记录</div>${rows}</div>`;
  }

  $('#priceBox').innerHTML = head +
    `<div class="legend">${ChartKit.legend(series)}</div>` + chart + changeBlock +
    `<div class="foot" style="border:none;padding-top:8px;margin-top:6px">
      阶梯图按变更日绘制：价格不变时为水平线，变更当天垂直跳变。图例右侧为当前到手价。
    </div>`;
}

function render() {
  renderBanner(); renderSchedBar(); renderGroupBar(); renderKpis();
  renderCompare(); renderTable(); renderRank(); renderChart(); renderPrices();
  renderCollectMgr();

  // 明细搬进「采集管理」后，结束时得说清去哪看，否则用户以为没跑完
  const jb = state.job || {};
  if (wasCollecting && !state.collecting && (jb.results || []).length) {
    const ok = jb.results.filter(r => r.ok).length;
    const bad = jb.results.length - ok;
    toast(bad
      ? `采集结束：${ok} 成功，${bad} 失败　明细见「采集管理」`
      : `采集完成：${ok} 个商品　明细见「采集管理」`);
  }
  wasCollecting = state.collecting;

  // 采集中不禁用：点了正好进去看进度
  $('#btnCollectMgr').textContent = state.collecting
    ? (jb.total ? `采集中 ${jb.done}/${jb.total}` : '采集中…')
    : '采集管理';
}

async function refresh() {
  state = await api(`/api/state?days=${$('#selDays').value}`);
  render();
  scheduleAutoRefresh();
}

// 采集中快轮询，空闲/后台时放慢，省电
function scheduleAutoRefresh() {
  clearTimeout(autoTimer);
  if (state.collecting) { autoTimer = setTimeout(() => refresh().catch(()=>{}), 1500); return; }
  const ms = document.hidden ? 60000 : 20000;
  autoTimer = setTimeout(() => { if (!document.hidden) refresh().catch(()=>{}); else scheduleAutoRefresh(); }, ms);
}

/* ---------- 分组操作 ---------- */
function groupOptions(selected) {
  const gs = (state.groups || []).filter(g => !g.isUngrouped).map(g => g.name);
  const opts = [`<option value="">未分组</option>`]
    .concat(gs.map(g => `<option value="${esc(g)}" ${g === selected ? 'selected' : ''}>${esc(g)}</option>`));
  return opts.join('');
}

/* ---------- 二次确认：先讲清影响，再让人点确认 ---------- */
/**
 * @param {object} o
 *  title      标题
 *  rows       [[标签, 值]] 要展示的关键信息
 *  impact     影响说明（多行文本）
 *  confirmText 确认按钮文案
 *  danger     是否危险操作（红色）
 *  onConfirm  确认后的回调
 *  onCancel   取消后回到哪（默认回到商品管理）
 */
function confirmAction(o, onCancel) {
  const rows = (o.rows || []).map(([k, v]) =>
    `<div class="cfmrow"><span class="cfmk">${esc(k)}</span><span class="cfmv">${esc(v)}</span></div>`).join('');
  openModal(`
    <div class="ch">${esc(o.title)}</div>
    <div class="cfmbox">
      ${rows}
      ${o.extraHtml || ''}
      ${o.impact ? `<div class="cfmimpact ${o.danger ? 'danger' : ''}">${o.impact}</div>` : ''}
    </div>
    <div class="mrow">
      <button class="ghost" id="cfCancel">取消</button>
      <button class="${o.danger ? 'dangerBtn' : 'primary'}" id="cfOk">${esc(o.confirmText || '确认')}</button>
    </div>`);
  $('#cfCancel').onclick = () => { if (onCancel) onCancel(); else closeModal(); };
  $('#cfOk').onclick = async () => {
    const btn = $('#cfOk');
    btn.disabled = true;
    btn.textContent = '处理中…';
    try { await o.onConfirm(document); }
    catch (e) { toast(e.message); btn.disabled = false; btn.textContent = o.confirmText || '确认'; }
  };
}

/* ---------- 商品管理（组管理 + 商品管理） ---------- */
let manageTab = 'groups';   // 'groups' | 'products'

  if (tab) manageTab = tab;
  const gs = (state.groups || []).filter(g => !g.isUngrouped);
  const ps = state.products;

  const groupRows = gs.map(g => {
    const items = ps.filter(p => (p.group || '').trim() === g.name);
    return `<div class="mrow2">
      <div class="mrow2main">
        <div class="mrow2name">${esc(g.name)}</div>
        <div class="rowsub">${items.length} 个商品${items.length ? '：' + items.map(x => esc(x.shop || '未知店铺')).join('、') : ''}</div>
      </div>
      <div class="mrow2act">
        <button class="sm ghost" data-gact="rename" data-g="${esc(g.name)}">改名</button>
        <button class="sm ghost danger" data-gact="del" data-g="${esc(g.name)}">解散</button>
      </div>
